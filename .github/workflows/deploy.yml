name: Deploy to Cloud Run

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  PROJECT_ID: episodic-ai-studio-2026
  REGION: us-central1
  WEB_SERVICE: episodic-ai-web
  API_SERVICE: episodic-ai-api
  ORCHESTRATOR_SERVICE: episodic-ai-orchestrator

jobs:
  # ── Build & Deploy Web (nginx static export) ────────────────────────────────
  deploy-web:
    name: Web → Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static export
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://episodic-ai-api-26273727080.us-central1.run.app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create .gcloudignore for web deployment
        run: |
          cat > .gcloudignore << 'EOF'
          node_modules
          .git
          *.log
          .env
          apps/api
          apps/web/node_modules
          apps/web/.next
          apps/web/src
          services
          packages
          EOF

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --source . \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --clear-base-image \
            --set-env-vars "NEXT_PUBLIC_API_URL=https://episodic-ai-api-26273727080.us-central1.run.app"

  # ── Deploy AI Orchestrator ───────────────────────────────────────────────────
  deploy-orchestrator:
    name: AI Orchestrator → Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Orchestrator to Cloud Run
        run: |
          gcloud run deploy ${{ env.ORCHESTRATOR_SERVICE }} \
            --source ./services/ai-orchestrator \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi

  # ── Deploy API ───────────────────────────────────────────────────────────────
  deploy-api:
    name: API → Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-orchestrator
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --source ./apps/api \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 3001 \
            --memory 512Mi \
            --set-env-vars "AI_ORCHESTRATOR_URL=https://episodic-ai-orchestrator-26273727080.us-central1.run.app"

  # ── Summary ─────────────────────────────────────────────────────────────────
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-api]
    if: always()
    steps:
      - name: Print URLs
        run: |
          echo "🌐 Web:          https://episodic-ai-web-26273727080.us-central1.run.app"
          echo "🔧 API:          https://episodic-ai-api-26273727080.us-central1.run.app"
          echo "🤖 Orchestrator: https://episodic-ai-orchestrator-26273727080.us-central1.run.app"
