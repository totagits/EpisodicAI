steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/episodic-ai-web:latest'
      - '-f'
      - 'Dockerfile.web'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/episodic-ai-web:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - episodic-ai-web
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/episodic-ai-web:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--quiet'
  # Build the static site in the shared Cloud Build workspace
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install', '--legacy-peer-deps']
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build', '--workspace=apps/web']

  # Deploy the compiled static export from apps/web/out to Firebase Hosting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        curl -sL https://firebase.tools | bash
        export FIREBASE_TOKEN=$$(gcloud auth print-access-token)
        firebase deploy --only hosting --project=episodicai --token=$$FIREBASE_TOKEN --debug || cat firebase-debug.log
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/episodic-ai-web:latest'
options:
  logging: CLOUD_LOGGING_ONLY
